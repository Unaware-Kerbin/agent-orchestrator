# Defaults applied when a tool call omits wait/model.
defaults:
  wait: true
  model: composer-2.5

# Local Cursor agents run against this directory when dispatch does not pass cwd.
# Cursor MCP interpolation can set WORKSPACE_CWD to ${workspaceFolder}.
# That path is also the default write-allowlist entry until you grant more via
# the GUI (npm run gui) or add_allowed_dir.
workspace:
  cwd: ${WORKSPACE_CWD}

backends:
  late-infer:
    type: lateinfer
    baseUrl: "http://127.0.0.1:8010/v1"
    model: "Harvard-DCML/ADAPT-Qwen3-2.3B-Instruct"
  # Per-model vLLM backends (vllm-<slug>) are created by start_vllm / GUI Start with Docker.
  # Ports are assigned dynamically in 8000–8099 and written back here — do not hardcode.
  cursor-local:
    type: cursor
    runtime: local
    model: composer-2.5

  cursor-cloud:
    type: cursor
    runtime: cloud
    model: composer-2.5

  openai:
    type: openai
    baseUrl: https://api.openai.com/v1
    model: gpt-4.1
    apiKeyEnv: OPENAI_API_KEY

  anthropic:
    type: anthropic
    model: claude-sonnet-4-5
    apiKeyEnv: ANTHROPIC_API_KEY
    maxTokens: 8192

  openrouter:
    type: openai
    baseUrl: https://openrouter.ai/api/v1
    model: anthropic/claude-sonnet-4
    apiKeyEnv: OPENROUTER_API_KEY

  gemini:
    type: openai
    baseUrl: https://generativelanguage.googleapis.com/v1beta/openai
    # One current model id (not a list, not models/…). GUI lists live ids when the key works.
    model: gemini-3.6-flash
    apiKeyEnv: GEMINI_API_KEY

  grok:
    type: openai
    baseUrl: https://api.x.ai/v1
    # Current xAI chat/code model (OpenAI-compatible). Disabled until XAI_API_KEY / GROK_API_KEY is set.
    model: grok-4.6
    apiKeyEnv: XAI_API_KEY

  ollama:
    type: ollama
    baseUrl: http://127.0.0.1:11434/v1
    model: llama3.1
    apiKey: ollama

  vllm-local:
    type: vllm
    baseUrl: http://127.0.0.1:8000/v1
    model: Qwen/Qwen2.5-7B-Instruct
    # apiKeyEnv: VLLM_API_KEY   # optional; local vLLM usually needs none
    # probe: false              # skip /models check and treat configured URL as ready

  # Extra local server (different port / served model):
  # vllm-other:
  #   type: vllm
  #   baseUrl: http://127.0.0.1:8001/v1
  #   model: mistralai/Mistral-7B-Instruct-v0.3

  # llama.cpp llama-server (OpenAI-compat). Start it yourself, bound to 127.0.0.1:
  #   llama-server -m /path/to/model.gguf --host 127.0.0.1 --port 8080
  # llamacpp:
  #   type: llamacpp
  #   baseUrl: http://127.0.0.1:8080/v1
  #   model: local

  # Generic HTTP agent: POST { prompt, system, history, metadata } → { text | result | output }
  # custom-http:
  #   type: http
  #   url: ${CUSTOM_AGENT_URL}
  #   timeoutMs: 120000
  #   headers:
  #     Authorization: Bearer ${CUSTOM_AGENT_TOKEN}

specialists:
  late-infer-chat:
    description: Late infer on your computer (OpenAI-compatible, loopback 127.0.0.1:8010; file writes stay on Cursor)
    backend: late-infer
    fallback: cursor-local
  planner:
    description: Breaks a goal into a sequenced implementation plan
    backend: anthropic
    fallback: cursor-local
    mode: plan

  builder:
    description: Implements features and writes code in the workspace
    backend: cursor-local
    fallback: cursor-cloud
    mode: agent

  reviewer:
    description: Reviews code for bugs, security, and merge readiness
    backend: openai
    fallback: cursor-local

  pr-triage:
    description: Diagnoses failing PR checks and merge blockers
    backend: cursor-local
    fallback: cursor-cloud

  gemini-planner:
    description: Alternate planner that prefers Gemini when a Google API key is set
    backend: gemini
    fallback: cursor-local

  grok-chat:
    description: xAI Grok OpenAI-compatible model (text only; file writes stay on Cursor)
    backend: grok
    fallback: cursor-local

  vllm-chat:
    description: Local vLLM OpenAI-compatible model (text only; file writes stay on Cursor)
    backend: vllm-local
    fallback: cursor-local

  ollama-chat:
    description: Local Ollama OpenAI-compatible model (text only; file writes stay on Cursor)
    backend: ollama
    fallback: cursor-local

  cloud-builder:
    description: Cursor cloud agent (cannot reach localhost vLLM; use extra_context or cloud-with-local-draft)
    backend: cursor-cloud
    fallback: cursor-local
    mode: agent

workflows:
  ship-feature:
    description: Plan, implement, then review a feature
    steps:
      - specialist: planner
      - specialist: builder
      - specialist: reviewer

  troubleshoot-pr:
    description: Diagnose a PR, apply a fix, then review
    steps:
      - specialist: pr-triage
      - specialist: builder
      - specialist: reviewer

  review-only:
    description: Review-only pass (no edits)
    steps:
      - specialist: reviewer

  local-and-cloud:
    description: Run the same prompt on Late infer (local) and a Cursor cloud agent in parallel. Orchestrator collects both. Late infer stays on 127.0.0.1; the cloud agent never calls it.
    mode: parallel
    steps:
      - specialist: late-infer-chat
      - specialist: cloud-builder

  cloud-with-local-draft:
    description: Late infer drafts first; a Cursor cloud agent then reviews/implements using that draft as text context. Cloud still uses the Cursor runtime, not localhost.
    steps:
      - specialist: late-infer-chat
      - specialist: cloud-builder
