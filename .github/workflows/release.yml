name: Build installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # One OS/arch per job so late-infer builds natively (pack only auto-builds host os-arch).
          - os: ubuntu-22.04
            target: linux-x64
            artifact: linux-x64
          - os: macos-14
            target: mac-arm64
            artifact: darwin-arm64
          # Intel Mac via cross-compile on Apple silicon (macos-13 runners are scarce/deprecated).
          - os: macos-14
            target: mac-x64
            artifact: darwin-x64
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            target: win-x64
            artifact: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Checkout late (late-infer crate)
        uses: actions/checkout@v4
        with:
          repository: Unaware-Kerbin/late
          path: _late
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Linux unpack tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Build late-infer for this runner
        shell: bash
        env:
          LATE_CHECKOUT: ${{ github.workspace }}/_late
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          if [[ -n "${RUST_TARGET}" && "${RUST_TARGET}" != "" ]]; then
            rustup target add "${RUST_TARGET}"
            crate="${LATE_CHECKOUT}/crates/late-infer"
            workspace="$(cd "${crate}/../.." && pwd)"
            echo "agent-orchestrator: cross-build late-infer --target ${RUST_TARGET}"
            cargo build -p late-infer --release --target "${RUST_TARGET}" --manifest-path "${workspace}/Cargo.toml"
            mkdir -p bin runtime/bin
            src="${CARGO_TARGET_DIR}/${RUST_TARGET}/release/late-infer"
            cp -a "$src" bin/late-infer
            cp -a "$src" runtime/bin/late-infer
            chmod +x bin/late-infer runtime/bin/late-infer
            ver="$(node -p "require('./package.json').version")"
            printf "%s\n" "$ver" > bin/late-infer.stamp
            printf "%s\n" "$ver" > runtime/bin/.late-infer-built-for
            echo "agent-orchestrator: packed cross late-infer -> bin/late-infer"
          else
            bash scripts/build-late-infer.sh
          fi
      - name: Package
        shell: bash
        env:
          PACK_OVERWRITE: "1"
        run: bash scripts/pack.sh --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-orchestrator-${{ matrix.artifact }}
          path: |
            release/*.tar.gz
            release/*.zip
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Portable GUI + Streamable HTTP `/mcp` (loopback only). Each archive includes Node 22 and packed `late-infer`.

            ### v0.1.5
            - Inference engines documented (late-infer / OpenVINO/Candle, Ollama, llama.cpp, vLLM Docker).
            - late-infer Hub pre-screen: `ovExportOk` / `loadable` from `model_type` + soft-fail cached `config.json` probe; loadable ungated rows sort first.
            - CI packs `late-infer` by building Unaware-Kerbin/late on each runner (no sibling checkout required).

            ### Install
            - **Linux / macOS:** extract, then `./bin/agent-orchestrator-gui`
            - **Windows:** extract, then `bin\agent-orchestrator-gui.cmd`
            - Copy the printed `/mcp` URL for Late. Stop with `--stop`.
            - Model weights are not included. vLLM Start still needs Docker. Bind defaults to `127.0.0.1` (or one private `listen_host`).

            See CHANGELOG.md for details.
